apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pod-resource-injector-role
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["patch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pod-resource-injector-binding
subjects:
- kind: ServiceAccount
  name: pod-resource-injector
  namespace: default
roleRef:
  kind: ClusterRole
  name: pod-resource-injector-role
  apiGroup: rbac.authorization.k8s.io
