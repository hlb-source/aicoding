audio:
  sample_rate: 16000
  channels: 1
  device_name: "远程音频"
  segment_duration: 5

whisper:
  model_size: "base"
  language: null
  temperature: 0.0
  initial_prompt: "以下是中英文混合的语音内容。包括中文和英文命令，例如：创建文件 main.py，read file app.py，运行test，写代码实现function。"

opencode:
  executable: "opencode"
  timeout: 60
  auto_confirm: true

keywords:
  创建类:
    - "创建"
    - "新建"
    - "生成"
    - "建立"
  读取类:
    - "读取"
    - "打开"
    - "查看"
    - "浏览"
  编辑类:
    - "编辑"
    - "修改"
    - "更新"
    - "调整"
  删除类:
    - "删除"
    - "移除"
    - "清除"
    - "去掉"
  执行类:
    - "运行"
    - "执行"
    - "启动"
    - "调用"
  生成类:
    - "写代码"
    - "生成代码"
    - "编写"
    - "编码"
  搜索类:
    - "搜索"
    - "查找"
    - "寻找"
    - "定位"
  显示类:
    - "显示"
    - "列出"
    - "展示"
    - "输出"
  测试类:
    - "测试"
    - "调试"
    - "验证"
    - "检查"

logging:
  voice_log: "logs/voice.log"
  command_log: "logs/commands.log"
  level: "INFO"
  max_size: 10485760
  backup_count: 5